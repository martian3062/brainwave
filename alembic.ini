[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Deliberately blank. alembic/env.py takes the URL from app.db.DATABASE_URL,
# which reads DATABASE_URL from the environment and rewrites Render's legacy
# `postgres://` scheme. Putting a URL here would let a stale ini out-vote the
# deployment environment.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
