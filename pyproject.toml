[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trappist-brainwave"
version = "0.1.0"
description = "TRAPPIST x BRAINWAVE -- MCP won the tool layer. This is its payment layer."
readme = "README.md"
requires-python = ">=3.11,<4"
license = { text = "MIT" }
authors = [{ name = "Pardeep Singh", email = "sandhupardeep300@gmail.com" }]
keywords = ["x402", "mcp", "agent-payments", "usdc", "base", "micropayments"]

# Kept in lockstep with requirements.txt, which is the file Render installs.
dependencies = [
    "nicegui==3.15.0",
    "x402[all]==2.16.0",
    "mcp==1.28.1",
    "sqlmodel==0.0.39",
    "SQLAlchemy==2.0.51",
    "alembic==1.18.5",
    "sqladmin==0.29.0",
    "cryptography==49.0.0",
    "uvicorn[standard]==0.51.0",
    "fastapi==0.140.2",
    "starlette==1.3.1",
    "jinja2==3.1.6",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "python-dotenv==1.2.2",
    "anthropic==0.120.0",
]

# The CLI needs no dependency of its own. `app.cli` is stdlib `argparse` -- no
# typer, no click, no rich, no colorama -- because a payment gateway should not
# install a CLI framework at deploy time to get prettier `--help`.
#
# `python -m app.cli ...` works from a plain checkout with nothing installed as
# a package; this entry point only exists for `pip install -e .`.
[project.scripts]
eraya = "app.cli:main"

[project.optional-dependencies]
postgres = ["psycopg2-binary==2.9.10"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
